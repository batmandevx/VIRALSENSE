[project]
name = "viralsense"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2.1", "pandas>=2.2", "pyarrow>=15", "pyyaml>=6", "tqdm",
  "scikit-learn>=1.5,<1.7", "imbalanced-learn>=0.12", "xgboost>=2.0", "lightgbm>=4.3", "optuna>=3.6",
  "scipy", "shap>=0.45", "matplotlib>=3.8", "seaborn",
  "pillow>=10", "opencv-python-headless>=4.9,<5",
  "torch>=2.3", "open_clip_torch>=2.24", "sentence-transformers>=3.0",
  "vaderSentiment>=3.3", "emoji>=2.10",
  "mabwiser>=2.7", "streamlit>=1.35", "plotly>=5.20", "requests",
]
[project.optional-dependencies]
dev = ["pytest>=8", "nbformat>=5", "ipykernel"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
